<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#14181b;color:#eef1ee;font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased}
  .card{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .mark{font-family:"Barlow Condensed";font-weight:700;font-size:40px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:16px}
  .dot{width:18px;height:18px;border-radius:50%;background:#3fae83;box-shadow:0 0 0 7px rgba(63,174,131,.22)}
  h1{font-family:"Barlow Condensed";font-weight:700;font-size:110px;line-height:.96;letter-spacing:-.01em;margin:0;max-width:1000px}
  h1 span{color:#f2662a}
  .sub{font-size:30px;line-height:1.35;color:#b3bdb8;max-width:900px;margin-top:26px}
  .foot{font-family:"IBM Plex Mono";font-size:24px;color:#7e8a85;display:flex;justify-content:space-between;align-items:baseline}
  .foot b{color:#eef1ee;font-weight:500;border-bottom:4px solid #f2662a;padding-bottom:4px}
  .stripe{position:absolute;left:0;top:0;bottom:0;width:14px;background:#f2662a}
</style></head><body><div class="card"><div class="stripe"></div>
<div class="mark"><span class="dot"></span>Bregstar</div>
<div><h1>Bregstar Heating &amp; Cooling. <span>Nobody at the desk.</span></h1><div class="sub">A demo HVAC company run entirely by the AI assistant. Call it, try to book a furnace repair, ask for a person, smell gas.</div></div>
<div class="foot"><span>bregstar.com</span><span>Call <b>(312) 624-6997</b></span></div>
</div></body></html>
